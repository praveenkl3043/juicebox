<!DOCTYPE html>
<html>
<head>
    <title>Juice Box Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .login-box {
            background: white;
            width: 350px;
            padding: 30px;
            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);

            text-align: center;
        }

        .login-box h1 {
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            box-sizing: border-box;

            padding: 12px;
            margin: 10px 0;

            border: 1px solid #ccc;
            border-radius: 6px;

            font-size: 16px;
        }

        .login-box button {
            width: 100%;

            padding: 12px;
            margin-top: 15px;

            border: none;
            border-radius: 6px;

            background: #222;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #444;
        }

        #message {
            margin-top: 15px;
            color: red;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>🥤 JUICE BOX</h1>

        <h2>Admin Login</h2>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
        >

        <button id="loginButton">
            Login
        </button>

        <p id="message"></p>

    </div>


    <script>

        document.getElementById("loginButton").addEventListener("click", function() {

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;


            if (username === "" || password === "") {

                document.getElementById("message").textContent =
                    "Please enter username and password.";

                return;
            }


            fetch("http://127.0.0.1:5000/api/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })

            })

            .then(response => response.json())

            .then(data => {

                if (data.message === "Login successful") {

                    if (data.user.role === "server_admin") {

                        window.location.href = "server-admin.html";

                    }
                    else if (data.user.role === "shop_owner") {

                        window.location.href = "shop-owner.html";

                    }

                }
                else {

                    document.getElementById("message").textContent =
                        data.message;

                }

            })

            .catch(error => {

                console.error("Login error:", error);

                document.getElementById("message").textContent =
                    "Unable to connect to server.";

            });

        });

    </script>

</body>
</html>
