<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice Box</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top Header -->
    <section class="tophead">
        <button class="menu-button">☰</button>
        <h2>JUICE BOX</h2>
    </section>

    <!-- Moving Welcome Text -->
    <section class="secondhead">
        <h2>Welcome to Juice Box</h2>
    </section>

    <!-- Main Area -->
    <div class="layout">

        <!-- Left Menu -->
        <aside class="side-menu">

            <h3>Add ons</h3>

            <a href="#">Burger (Non veg)</a>
            <a href="#">Burger (veg)</a>
            <a href="#">Combos (Non veg)</a>
            <a href="#">Combos (veg)</a>
            <a href="#">FALUDA</a>
            <a href="#">Frankies</a>
            <a href="#">Fries</a>
            <a href="#">Fruit shakes</a>
            <a href="#" id="juiceButton">Juice</a>

        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">

            <h2>Welcome to Juice Box</h2>

            <p>Select an item from the menu.</p>

        </main>
        <aside class="cart" id="cart">

    <div class="cart-header">
        <div>
            <h2>Cart</h2>
            <span id="cartItemCount">0 Items</span>
        </div>

        <button class="clear-cart" onclick="clearCart()">🗑</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-total">
        <h3>
            <span>Total</span>
            <span>₹<span id="cartTotal">0</span></span>
        </h3>
    </div>

    <button id="checkoutButton" class="checkout-button">
        🛒 Checkout
    </button>

</aside>


<!-- Mobile Cart Bar -->
<div class="cart-mobile-bar" id="mobileCartBar">

    <span class="cart-mobile-count" id="mobileCartCount">
        0 Items added
    </span>

    <span class="cart-mobile-view">
        View Cart ›
    </span>

</div>

    </div>
<script src="java.js"></script>
</body>

</html>
