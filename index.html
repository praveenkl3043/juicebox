<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juice Box</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top Header -->
    <section class="tophead">
        <img src="images/Logo/logo1.png" alt="Juice Box Logo" class="logo">
    </section>

    <!-- Moving Welcome Text -->
    <section class="secondhead">
        <h2>Welcome to Juice Box</h2>
    </section>

    <!-- Main Area -->
    <div class="layout">

        <!-- Left Menu -->
        <aside class="side-menu">

            <h3>MENU</h3>
            
            <a href="#">QUICK BITES (Non veg)</a>
            <a href="#">QUICK BITES (veg)</a>
            <a href="#">Combos (Non veg)</a>
            <a href="#">Combos (veg)</a>
            <a href="#">FRIES</a>
            <a href="#"id="mocktailsButton">MOCKTAILS</a>
            <a href="#"id="lemonspecialButton">LEMON SPECIAL</a>
            <a href="#"id="thickshakesButton">THICK SHAKES</a>
            <a href="#"id="milkshakesButton">MILK SHAKES</a>
            <a href="#"id="fruitshakesButton">FRUIT SHAKES</a>
            <a href="#" id="juiceButton">JUICES</a>
            <a href="#">ADD ONS</a>

        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">

            <h2>Welcome to Juice Box</h2>

            <p>Select an item from the menu.</p>

        </main>
        <aside class="cart" id="cart">

    <div class="cart-header">
        <button class="back-cart" onclick="closeCart()">‹</button>
        <div>
            <h2>Cart</h2>
            <span id="cartItemCount">0 Items</span>
        </div>

        <button class="clear-cart" onclick="clearCart()">🗑</button>
    </div>

    <div id="cartItems"></div>

    <div class="cart-total">
        <h3>
            <span>Total</span>
            <span>₹<span id="cartTotal">0</span></span>
        </h3>
    </div>

    <button id="checkoutButton" class="checkout-button">
        🛒 Checkout
    </button>
    <div id="billSection" style="display: none;">
        <button id="generateBillButton" class="generate-bill-button">
            🧾 Generate Bill
        </button>
    </div>

</aside>


<!-- Mobile Cart Bar -->
<div class="cart-mobile-bar" id="mobileCartBar" onclick="openCart()">

    <span class="cart-mobile-count" id="mobileCartCount">
        0 Items added
    </span>

    <span class="cart-mobile-view">
        View Cart ›
    </span>

</div>

    </div>
<script src="java.js"></script>
</body>

</html>
