<!DOCTYPE html>
<html>

<head>
    <title>Juice Box</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top Header -->
    <section class="tophead">
        <button class="menu-button">☰</button>
        <h2>JUICE BOX</h2>
    </section>

    <!-- Moving Welcome Text -->
    <section class="secondhead">
        <h2>Welcome to Juice Box</h2>
    </section>

    <!-- Main Area -->
    <div class="layout">

        <!-- Left Menu -->
        <aside class="side-menu">

            <h3>Add ons</h3>

            <a href="#">Burger (Non veg)</a>
            <a href="#">Burger (veg)</a>
            <a href="#">Combos (Non veg)</a>
            <a href="#">Combos (veg)</a>
            <a href="#">FALUDA</a>
            <a href="#">Frankies</a>
            <a href="#">Fries</a>
            <a href="#">Fruit shakes</a>
            <a href="#" id="juiceButton">Juice</a>

        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent">

            <h2>Welcome to Juice Box</h2>

            <p>Select an item from the menu.</p>

        </main>
        <aside class="cart">

            <h2>Cart</h2>
        
            <div id="cartItems"></div>
        
            <hr>
        
            <h3>Total: ₹<span id="cartTotal">0</span></h3>
            <button id="checkoutButton">Checkout</button>
        
        </aside>

    </div>
<script src="java.js"></script>
</body>

</html>
